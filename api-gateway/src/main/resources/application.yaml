server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=X-Gateway
            - AddRequestHeader=X-Gateway, restaurant-gateway
          routes:
            - id: restaurant-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/restaurants/**
              filters:
                - StripPrefix=1


