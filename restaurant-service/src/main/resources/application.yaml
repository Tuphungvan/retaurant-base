server:
  port: 8083

spring:
  application:
    name: restaurant-service

  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant?currentSchema=restaurant
    username: tupv
    password: 123456
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:/liquibase/master.xml
    default-schema: restaurant
    liquibase-schema: public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: restaurant

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
